<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kizuna</title>
<meta name="robots" content="noindex">
<style>
  :root { --bg:#fbf9ff; --card:#fff; --text:#1b1b22; --muted:#5f5f6b; --primary:#5b4fe0; --on:#fff; --line:#e4dfff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#13121a; --card:#1c1b25; --text:#ececf4; --muted:#a3a3b3; --primary:#a79eff; --on:#1a0068; --line:#2c2a3b; }
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px; background:var(--bg); color:var(--text);
         font:16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { width:100%; max-width:420px; background:var(--card); border:1px solid var(--line); border-radius:28px; padding:28px 24px; text-align:center; }
  .cover { width:96px; height:136px; border-radius:18px; object-fit:cover; background:var(--line); margin:0 auto 16px; display:block; }
  .cover[hidden] { display:none; }
  h1 { font-size:1.35rem; margin:0 0 4px; }
  p { margin:0 0 20px; color:var(--muted); }
  .ext { color:var(--primary); font-weight:600; }
  a.btn { display:block; padding:14px 18px; border-radius:16px; text-decoration:none; font-weight:600; margin-top:10px; }
  a.primary { background:var(--primary); color:var(--on); }
  a.ghost { border:1px solid var(--line); color:var(--text); }
  small { display:block; margin-top:18px; color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Obra compartida en Kizuna</h1>
  <p>Alguien quiere compartir contigo una obra.</p>
  <a id="open" class="btn primary" href="#">Abrir en Kizuna</a>
  <a class="btn ghost" href="https://github.com/StalFre/Kizuna-releases/releases/latest">Descargar Kizuna</a>
  <small>Si no tienes la extensión, Kizuna te preguntará si quieres instalarla.</small>
</main>
<script>
  // Data lives after '#', so it never reaches any server. Only fixed texts are shown, nothing from the link is rendered.
  var params = location.hash.slice(1);
  var deep = "kizuna://share?" + params;
  document.getElementById("open").href = deep;
  // Try to open the app right away; if it is not installed nothing happens and the buttons stay.
  if (params) setTimeout(function () { location.href = deep; }, 300);
</script>
</body>
</html>
